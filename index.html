<!DOCTYPE html>
<html class="light" lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Connexion | nosregistre</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

      tailwind.config = {
        darkMode: "class",

          extend: {
            "colors": {
                "surface-container-highest": "#e2e2e2",

                "teal-accent": "#01655E",
                "surface-container-high": "#e8e8e8",
                "on-background": "#1a1c1c",
                "tertiary": "#000321",
                "on-secondary": "#ffffff",
                "on-secondary-fixed-variant": "#00531e",
                "primary-fixed": "#dee0ff",
                "border-light": "#E2E5F1",
                "muted-periwinkle": "#9BA6E8",
                "tertiary-fixed": "#dee0ff",
                "surface": "#f9f9f9",
                "surface-container-low": "#f3f3f4",
                "secondary-fixed-dim": "#00e562",
                "electric-green": "#00FA6C",
                "surface-subtle": "#F8F9FD",
                "outline-variant": "#c7c5ce",
                "surface-bright": "#f9f9f9",
                "surface-dim": "#dadada",
                "primary": "#000220",
                "on-surface": "#1a1c1c",
                "background": "#f9f9f9",
                "deep-navy": "#171C3A",
                "on-tertiary-fixed-variant": "#37427d",
                "on-primary": "#ffffff",
                "inverse-primary": "#c0c4eb",
                "on-secondary-container": "#00702c",
                "tertiary-container": "#0b1853",
                "primary-fixed-dim": "#c0c4eb",
                "on-primary-fixed-variant": "#404565",
                "on-secondary-fixed": "#002108",
                "surface-variant": "#e2e2e2",
                "inverse-on-surface": "#f0f1f1",
                "on-error": "#ffffff",
                "on-tertiary": "#ffffff",
                "secondary": "#006e2b",
                "secondary-fixed": "#69ff88",

                "on-error-container": "#93000a",

            "borderRadius": {

            "spacing": {

      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        
        body {
            background: linear-gradient(135deg, #171c3a 0%, #013e38 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-card {
            background-color: rgba(23, 28, 58, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 229, 241, 0.1);
        }

        .custom-input:focus {
            border-color: #00FA6C;
            box-shadow: 0 0 0 1px #00FA6C;
        }

        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body class="font-body-md text-on-surface antialiased overflow-x-hidden">
<!-- Barre de navigation supérieure : vide -->
<header class="flex justify-center items-center w-full py-8 px-4 bg-transparent fixed top-0 z-50"></header>
<!-- Zone de contenu principale -->
<main class="flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop py-20 mt-10">
<div class="w-full max-w-[480px] auth-card rounded-xl p-8 md:p-12 transition-all duration-500 hover:shadow-2xl">
<h1 class="font-headline-lg text-headline-lg text-on-primary text-center mb-10">Connexion</h1>
<form action="#" class="space-y-6" id="loginForm" method="POST">
<!-- Champ Email professionnel -->
<div class="space-y-2">
<label class="font-body-sm text-body-sm text-muted-periwinkle block" for="email">Email professionnel</label>
<div class="relative group">
<input class="w-full bg-transparent border border-white/20 rounded-full py-4 px-6 text-on-primary placeholder:text-white/30 focus:outline-none focus:border-electric-green transition-all custom-input" id="email" name="email" placeholder="vous@entreprise.com" type="email"/>
<span class="material-symbols-outlined absolute right-6 top-1/2 -translate-y-1/2 text-white/40 group-focus-within:text-electric-green transition-colors">mail</span>
</div>
</div>
<!-- Champ Mot de passe -->
<div class="space-y-2">
<label class="font-body-sm text-body-sm text-muted-periwinkle block" for="password">Mot de passe</label>
<div class="relative group">
<input class="w-full bg-transparent border border-white/20 rounded-full py-4 px-6 text-on-primary placeholder:text-white/30 focus:outline-none focus:border-electric-green transition-all custom-input" id="password" name="password" placeholder="Entrez votre mot de passe" type="password"/>
<button class="absolute right-6 top-1/2 -translate-y-1/2 text-white/40 hover:text-white transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Lien Mot de passe oublié -->
<div class="flex justify-end">
<a class="font-body-sm text-body-sm text-muted-periwinkle hover:text-electric-green transition-colors" href="#">Mot de passe oublié ?</a>
</div>
<!-- Bouton de connexion -->
<button class="w-full bg-electric-green text-primary font-button-text text-button-text py-4 rounded-full transition-all active:scale-95 hover:brightness-110 shadow-lg shadow-electric-green/20" type="submit">SE CONNECTER</button>
</form>
<!-- Séparateur -->
<div class="relative my-10">
<div aria-hidden="true" class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/10"></div></div>
<div class="relative flex justify-center text-xs"><span class="bg-transparent px-2 font-label-md text-label-md text-white/40">OU</span></div>
</div>
<!-- Bouton Se connecter avec Google (remplace le spinner) -->
<button class="w-full border border-white/20 text-on-primary font-button-text text-button-text py-4 rounded-full hover:bg-white/5 transition-all flex items-center justify-center gap-3" type="button" id="googleLoginBtn">
<!-- Icône Google officielle (couleurs) -->
<svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
</svg>
<span>Se connecter avec Google</span>
</button>
<!-- Lien d'inscription -->
<div class="text-center mt-8">
<p class="font-body-sm text-body-sm text-muted-periwinkle">Vous n'avez pas de compte ? <a class="text-muted-periwinkle hover:text-electric-green transition-colors font-semibold ml-1" href="#">S'inscrire</a></p>
</div>
</div>
</main>
<!-- Pied de page vide -->
<footer class="fixed bottom-0 left-0 w-full flex flex-col md:flex-row justify-center items-center gap-4 py-6 px-4 bg-transparent"></footer>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.innerHTML = '<span class="flex items-center justify-center"><svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> CONNEXION EN COURS...</span>';
            setTimeout(() => {
                btn.textContent = originalText;
                alert('La logique de connexion se déclencherait ici.');
            }, 1500);
        });

        document.getElementById('googleLoginBtn').addEventListener('click', function() {
            alert('Connexion avec Google (simulation)');
        });
    </script>
</body>
</html>
