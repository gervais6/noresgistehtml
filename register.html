<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Inscription | Registre+</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Hanken Grotesk -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'primary': '#00fa6c',
            'surface': '#111410',
            'surface-dim': '#0b0f0b',
            'surface-container': '#191d18',
            'on-surface': '#e2e3dd',
            'on-surface-variant': '#c2c9bd',
          },
          fontFamily: {
            sans: ['Hanken Grotesk', 'sans-serif'],
          },
          maxWidth: {
            'container-max': '1280px',
          },
          spacing: {
            'margin-desktop': '5%',
          },
          gap: {
            'gutter': '24px',
          }
        }
      }
    }
  </script>
<style>
    body {
      background-color: #111410;
      color: #e2e3dd;
      font-family: 'Hanken Grotesk', sans-serif;
    }
    .glass-card {
      background: rgba(25, 29, 24, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .custom-input {
      background-color: transparent !important;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }
    .custom-input:focus {
      border-color: #00fa6c;
      box-shadow: 0 0 0 1px #00fa6c;
      outline: none;
      background-color: transparent !important;
    }
    .custom-input:hover {
      border-color: rgba(0, 250, 108, 0.5);
    }
    /* Forcer la transparence sur l'autofill des navigateurs */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 30px #111410 inset !important;
      -webkit-text-fill-color: #e2e3dd !important;
      caret-color: #e2e3dd;
      transition: background-color 5000s ease-in-out 0s;
    }
    ::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
<!-- Barre de navigation -->
<nav class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md border-b border-white/5 transition-all duration-300">
<div class="flex justify-between items-center px-margin-desktop py-4 max-w-container-max mx-auto w-full">
<div class="flex items-center gap-8">
<a class="text-2xl font-extrabold text-white tracking-tight" href="#">Registre+</a>
<div class="hidden lg:flex items-center gap-6">
<a class="text-sm font-medium text-on-surface-variant hover:text-primary transition-colors" href="#">Accueil</a>
<a class="text-sm font-medium text-on-surface-variant hover:text-primary transition-colors" href="#">Fonctionnalités</a>
<a class="text-sm font-medium text-on-surface-variant hover:text-primary transition-colors" href="#">Tarifs</a>
<a class="text-sm font-medium text-on-surface-variant hover:text-primary transition-colors" href="#">Support</a>
</div>
</div>
<div class="flex items-center gap-4">
<button class="text-sm font-semibold text-white px-4 py-2 hover:opacity-80">Connexion</button>
<button class="bg-primary text-black font-bold text-sm px-6 py-2.5 rounded hover:scale-105 active:scale-95 transition-all">Essai gratuit</button>
</div>
</div>
</nav>
<!-- Zone d'inscription centrée -->
<main class="flex-grow flex items-center justify-center pt-32 pb-20 px-4">
<div class="w-full max-w-md">
<div class="glass-card rounded-2xl p-8 md:p-10 transition-all duration-300 hover:shadow-[0_0_30px_rgba(0,250,108,0.1)]">
<div class="text-center mb-8">
<h1 class="text-3xl md:text-4xl font-extrabold text-white mb-2">Créer un compte</h1>
<p class="text-on-surface-variant text-sm">Rejoignez l’accueil numérique sans papier</p>
</div>
<form action="#" class="space-y-6" id="registerForm" method="POST">
<!-- Nom complet -->
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant" for="full_name">Nom complet</label>
<div class="relative">
<input class="w-full custom-input rounded-xl py-3.5 px-5 text-white placeholder:text-on-surface-variant/50 focus:outline-none" id="full_name" name="full_name" placeholder="Jean Dupont" type="text"/>
<span class="material-symbols-outlined absolute right-5 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-xl">person</span>
</div>
</div>
<!-- Email professionnel -->
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant" for="email">Email professionnel</label>
<div class="relative">
<input class="w-full custom-input rounded-xl py-3.5 px-5 text-white placeholder:text-on-surface-variant/50 focus:outline-none" id="email" name="email" placeholder="vous@entreprise.com" type="email"/>
<span class="material-symbols-outlined absolute right-5 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-xl">mail</span>
</div>
</div>
<!-- Mot de passe -->
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant" for="password">Mot de passe</label>
<div class="relative">
<input class="w-full custom-input rounded-xl py-3.5 px-5 text-white placeholder:text-on-surface-variant/50 focus:outline-none" id="password" name="password" placeholder="Créez un mot de passe" type="password"/>
<button class="absolute right-5 top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-white transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-xl" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Bouton d'inscription -->
<button class="w-full bg-primary text-black font-bold text-base py-3.5 rounded-xl hover:brightness-110 active:scale-[0.98] transition-all shadow-lg shadow-primary/20" type="submit">S'INSCRIRE</button>
</form>
<!-- Séparateur -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/10"></div></div>
<div class="relative flex justify-center text-xs"><span class="bg-transparent px-2 text-on-surface-variant">OU</span></div>
</div>
<!-- Bouton Google -->
<button class="w-full flex items-center justify-center gap-3 border border-white/10 hover:border-primary/50 text-white font-medium text-sm py-3.5 rounded-xl hover:bg-white/5 transition-all" type="button" id="googleSignupBtn">
<svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
</svg>
<span>S'inscrire avec Google</span>
</button>
<!-- Lien de connexion -->
<div class="text-center mt-8">
<p class="text-sm text-on-surface-variant">Vous avez déjà un compte ? <a class="text-primary font-semibold hover:underline ml-1" href="#">Se connecter</a></p>
</div>
</div>
<!-- Mention de sécurité -->
<p class="text-center text-xs text-on-surface-variant/50 mt-6">Conforme RGPD – Données hébergées en France</p>
</div>
</main>
<!-- Pied de page simplifié -->
<footer class="border-t border-white/5 py-8 mt-auto">
<div class="max-w-container-max mx-auto px-margin-desktop flex flex-col md:flex-row justify-between items-center gap-4">
<p class="text-on-surface-variant text-xs">© 2024 Registre+, Inc. Tous droits réservés.</p>
<div class="flex gap-6 text-xs text-on-surface-variant">
<a class="hover:text-primary transition-colors" href="#">Confidentialité</a>
<a class="hover:text-primary transition-colors" href="#">Conditions</a>
<a class="hover:text-primary transition-colors" href="#">Sécurité</a>
</div>
</div>
</footer>

<script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      const eye = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        eye.textContent = 'visibility_off';
      } else {
        pwd.type = 'password';
        eye.textContent = 'visibility';
      }
    }

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = this.querySelector('button[type="submit"]');
      const original = btn.textContent;
      btn.innerHTML = '<span class="flex items-center justify-center"><svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> INSCRIPTION EN COURS...</span>';
      setTimeout(() => {
        btn.textContent = original;
        alert('Inscription simulée. Redirection vers le tableau de bord.');
      }, 1500);
    });

    document.getElementById('googleSignupBtn').addEventListener('click', function() {
      alert('Inscription avec Google (simulation)');
    });
  </script>
</body>
</html>
